name: Deploy para Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build e Publicação na Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Checagem completa de qualidade e testes
        run: npm run verify
        env:
          VITE_SECURITY_SALT: ${{ secrets.VITE_SECURITY_SALT }}
          VITE_MASTER_TOKEN_HASH: ${{ secrets.VITE_MASTER_TOKEN_HASH }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}

      - name: Preparar arquivos específicos da Hostinger
        run: node scripts/prepare-hostinger.cjs

      - name: Enviar arquivos para a Hostinger via FTP / FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            hostinger-deploy.zip
